<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | Professional UI</title>
  <meta name="description" content="A secure admin login portal.">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Admin specific overrides */
    .auth-sidebar {
      background: linear-gradient(135deg, #1e293b, #0f172a);
    }
    .btn-primary {
      background: var(--danger);
    }
    .btn-primary:hover {
      background: #dc2626;
    }
    .role-badge.active {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div id="toast-container"></div>

  <div class="auth-wrapper">
    <!-- Left Sidebar Branding -->
    <div class="auth-sidebar">
      <div class="auth-sidebar-content">
        <h1>Admin Portal</h1>
        <p>Restricted access. Authorized personnel only. Monitor the system and manage user configurations securely.</p>
      </div>
    </div>

    <!-- Right Main Area -->
    <div class="auth-main">
      <div class="auth-container">
        <div class="glass-card">
          <div class="auth-header">
            <h2>System Administration</h2>
            <p>Please enter your credentials</p>
          </div>

          <form id="adminForm">
            <div class="form-group">
              <label for="adminId">Admin ID or Email</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-shield-halved icon"></i>
                <input type="text" id="adminId" placeholder="admin@system.com" required>
              </div>
            </div>

            <div class="form-group">
              <label for="password">Admin Password</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-lock icon"></i>
                <input type="password" id="password" placeholder="••••••••" required>
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')">
                  <i class="fa-regular fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label for="token">Security Token (2FA)</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-key icon"></i>
                <input type="text" id="token" placeholder="6-digit code">
              </div>
            </div>

            <div class="form-options">
              <label class="checkbox-wrapper">
                <input type="checkbox" id="rememberMe">
                <span>Remember Me</span>
              </label>
            </div>

            <button type="submit" class="btn-primary">
              <span>Secure Login</span>
              <i class="fa-solid fa-right-to-bracket"></i>
            </button>
          </form>

          <div class="role-switch">
            <a href="index.html" class="role-badge">User</a>
            <a href="admin-login.html" class="role-badge active">Admin</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/main.js"></script>
</body>
</html>
