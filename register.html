<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Professional UI</title>
  <meta name="description" content="A stunning and responsive user registration interface.">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="toast-container"></div>

  <div class="auth-wrapper">
    <!-- Left Sidebar Branding -->
    <div class="auth-sidebar">
      <div class="auth-sidebar-content">
        <h1>Join ProSystem</h1>
        <p>Unlock access to premium dashboards, real-time analytics, and advanced user management features.</p>
      </div>
    </div>

    <!-- Right Main Area -->
    <div class="auth-main">
      <div class="auth-container">
        <div class="glass-card">
          <div class="auth-header">
            <h2>Create an Account</h2>
            <p>Get started with your free account</p>
          </div>

          <form id="registerForm">
            <div class="form-group">
              <label for="username">Username</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-user icon"></i>
                <input type="text" id="username" placeholder="john_doe" required>
              </div>
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-envelope icon"></i>
                <input type="email" id="email" placeholder="you@example.com" required>
              </div>
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-lock icon"></i>
                <input type="password" id="password" placeholder="••••••••" required>
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')">
                  <i class="fa-regular fa-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn-primary" style="margin-top: 10px;">
              <span>Create Account</span>
              <i class="fa-solid fa-user-plus"></i>
            </button>
          </form>

          <div class="auth-footer">
            Already have an account? <a href="index.html">Sign in</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/main.js"></script>
</body>
</html>
